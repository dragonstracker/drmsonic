name: build

on:
  push:
    branches: [main, devloper]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: drmsonic-binaries
          path: bin/
