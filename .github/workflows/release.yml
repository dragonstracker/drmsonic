name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: vet and test
        run: |
          go vet ./...
          go test ./...

      - name: build binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X drmsonic/internal/config.VersionTag=${VERSION}"
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/drmsonic-linux-amd64     ./cmd/drmsonic
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/drmsonic-linux-arm64     ./cmd/drmsonic
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/drmsonic-windows-amd64.exe ./cmd/drmsonic
          cp deploy/install.sh dist/install.sh
          cp deploy/uninstall.sh dist/uninstall.sh
          cd dist
          sha256sum drmsonic-linux-amd64 drmsonic-linux-arm64 drmsonic-windows-amd64.exe install.sh uninstall.sh > SHA256SUMS

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          name: drmsonic ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/drmsonic-linux-amd64
            dist/drmsonic-linux-arm64
            dist/drmsonic-windows-amd64.exe
            dist/install.sh
            dist/uninstall.sh
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
