<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}
		{{ if .Providers }}
		<br>
		<div style="display: flex; padding: 0 20px;">
			<select style='text-align:center; vertical-align:middle; font-weight: bold; width: 335px; height: 30px' id="providerSelection" >
				{{range $n, $g := .Providers}}
				<option value="{{$g.Id}}">{{$g.Name}}</option>
				{{end}}
			</select>
		</div>
		<br>
		<a id="eventsstatus" style="margin-left: 20px"></a>
		<br>
		<br>
		{{ end }}

		<h2 style='text-align:center;'>Schedule</h2>
		<table style="clear:both;" id="epgtable" class="table table-dark table-bordered" border="1" >
			<thead>
				<TR style='text-align:center; vertical-align:middle;'>
					<TH>Title</TH>
					<TH>Status</TH>
					<TH>Start Date</TH>
					<TH>End Date</TH>
					<TH>Event Id</TH>
					<TH>Action</TH>
				</TR>
			</thead>
			<tbody>
			</tbody>
		</table>

		<br>
		<h2 style='text-align:center;'>Replays</h2>
		<table style="clear:both;" id="replaystable" class="table table-dark table-bordered" border="1" >
			<thead>
				<TR style='text-align:center; vertical-align:middle;'>
					<TH>Title</TH>
					<TH>Start Date</TH>
					<TH>End Date</TH>
					<TH>Event Id</TH>
					<TH></TH>
				</TR>
			</thead>
			<tbody>
			</tbody>
		</table>


		<script type="text/javascript">

			var hls;
			initPlayer();

			document.getElementById('eventsbutton').style.backgroundColor = 'darkblue';
			const eventsloader = document.querySelector("#eventsloading");
			providerSelection.onchange = refreshEpgWithProvider

			{{ if .ProviderId }}
			for (i=0; i<document.getElementById('providerSelection').length; i++) {
				if (document.getElementById('providerSelection').options[i].value == '{{ .ProviderId }}') {
					document.getElementById('providerSelection').selectedIndex = i;
					break
				}
			}
			{{ end }}

			var epgtable = $('#epgtable').DataTable( {
							"lengthMenu": [ [10, 25, 50, 100, -1], [10, 25, 50, 100, "All"] ],
							"dom": "<i><'row' <'col-sm'l><'col-sm'p><'col-sm'f>>rt",
							"ordering": false,
							"responsive": true,
							"columns": [
						{ "width": "20%" }, { "width": "10%" }, { "width": "20%" }, { "width": "20%" }, { "width": "5%" }, { "width": "5%" } ]
						});
			var replaystable = $('#replaystable').DataTable( {
							"lengthMenu": [ [10, 25, 50, 100, -1], [10, 25, 50, 100, "All"] ],
							"dom": "<i><'row' <'col-sm'l><'col-sm'p><'col-sm'f>>rt",
							"ordering": false,
							"responsive": true,
							"columns": [
						{ "width": "20%" }, { "width": "20%" }, { "width": "20%" }, { "width": "20%" }, { "width": "10%" } ]
						});

			getReplays(replaystable);
			getEvents(epgtable);

			updateEvents(epgtable);
			intervalId=setInterval("updateEvents(epgtable);",1000);
		</script>

	</body>

</html>
