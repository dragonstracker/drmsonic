<html>
	<head>
		<title>DRMSONIC</title>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<link href="static/drmsonic.ico" rel="icon"/>
		<link rel="preconnect" href="https://fonts.googleapis.com"/>
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
		<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
		<style>
			:root {
				--bg: #050607;
				--ink: #f2f4f7;
				--mute: #8b93a1;
				--line: #1c2129;
				--field: #0c0f13;
				--accent: #1f6feb;
				--accent-2: #58a6ff;
				--bad: #ff6b6b;
			}
			* { box-sizing: border-box; }
			html, body { height: 100%; }
			body {
				margin: 0;
				color: var(--ink);
				font-family: Barlow, sans-serif;
				background:
					radial-gradient(1200px 600px at 12% -10%, rgba(31, 111, 235, 0.22), transparent 55%),
					radial-gradient(900px 500px at 95% 110%, rgba(88, 166, 255, 0.08), transparent 50%),
					linear-gradient(160deg, #050607 0%, #0a0d12 48%, #050607 100%);
			}
			.shell {
				min-height: 100%;
				display: grid;
				grid-template-columns: minmax(280px, 1.15fr) minmax(300px, 420px);
				align-items: stretch;
			}
			.brand {
				position: relative;
				padding: clamp(2rem, 6vw, 4.5rem);
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				border-right: 1px solid var(--line);
				overflow: hidden;
			}
			.brand::before {
				content: "";
				position: absolute;
				inset: 0;
				background-image:
					linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
					linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
				background-size: 48px 48px;
				mask-image: linear-gradient(180deg, transparent, #000 35%, #000 85%, transparent);
				pointer-events: none;
			}
			.brand-mark {
				position: relative;
				font-family: "Barlow Condensed", sans-serif;
				font-weight: 700;
				font-size: clamp(3.2rem, 8vw, 5.5rem);
				line-height: 0.9;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				margin: 0;
			}
			.brand-mark span { color: var(--accent-2); }
			.brand-line {
				position: relative;
				width: 72px;
				height: 3px;
				margin: 1.1rem 0 1rem;
				background: var(--accent);
			}
			.brand-copy {
				position: relative;
				max-width: 28rem;
				margin: 0;
				color: var(--mute);
				font-size: 0.98rem;
				line-height: 1.5;
				font-weight: 400;
			}
			.panel {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem 1.5rem;
				background: rgba(8, 10, 14, 0.72);
			}
			.form-wrap {
				width: 100%;
				max-width: 340px;
			}
			.form-kicker {
				margin: 0 0 0.35rem;
				font-family: "Barlow Condensed", sans-serif;
				font-size: 0.85rem;
				font-weight: 600;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: var(--accent-2);
			}
			.form-title {
				margin: 0 0 1.5rem;
				font-family: "Barlow Condensed", sans-serif;
				font-size: 1.85rem;
				font-weight: 700;
				letter-spacing: 0.02em;
			}
			label {
				display: block;
				margin: 0 0 0.4rem;
				font-size: 0.78rem;
				font-weight: 500;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				color: var(--mute);
			}
			.field {
				width: 100%;
				margin: 0 0 1rem;
				padding: 0.78rem 0.9rem;
				border: 1px solid var(--line);
				border-radius: 2px;
				background: var(--field);
				color: var(--ink);
				font: inherit;
				font-size: 0.98rem;
				outline: none;
				transition: border-color 0.15s ease, box-shadow 0.15s ease;
			}
			.field:focus {
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.25);
			}
			.err {
				min-height: 1.25rem;
				margin: 0 0 0.85rem;
				color: var(--bad);
				font-size: 0.88rem;
			}
			.btn-login {
				width: 100%;
				margin-top: 0.35rem;
				padding: 0.85rem 1rem;
				border: 0;
				border-radius: 2px;
				background: var(--accent);
				color: #fff;
				font-family: "Barlow Condensed", sans-serif;
				font-size: 1.05rem;
				font-weight: 700;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				cursor: pointer;
				transition: background 0.15s ease, transform 0.12s ease;
			}
			.btn-login:hover { background: #2b7af0; }
			.btn-login:active { transform: translateY(1px); }
			@media (max-width: 820px) {
				.shell { grid-template-columns: 1fr; }
				.brand {
					min-height: 38vh;
					border-right: 0;
					border-bottom: 1px solid var(--line);
					justify-content: flex-end;
				}
				.brand-mark { font-size: clamp(2.6rem, 12vw, 3.8rem); }
			}
		</style>
	</head>
	<body>
		<div class="shell">
			<section class="brand">
				<h1 class="brand-mark">DRM<span>SONIC</span></h1>
				<div class="brand-line"></div>
				<p class="brand-copy">Stream control for operators who keep the feed alive.</p>
			</section>
			<section class="panel">
				<div class="form-wrap">
					<p class="form-kicker">Operator access</p>
					<h2 class="form-title">Sign in</h2>
					{{ if .Error }}<div class="err">{{ .Error }}</div>{{ else }}<div class="err"></div>{{ end }}
					<form method="POST" action="/login" autocomplete="off">
						<label for="username">Username</label>
						<input class="field" id="username" name="username" type="text" required autofocus/>
						<label for="password">Password</label>
						<input class="field" id="password" name="password" type="password" required/>
						<button class="btn-login" type="submit">Enter</button>
					</form>
				</div>
			</section>
		</div>
	</body>
</html>
