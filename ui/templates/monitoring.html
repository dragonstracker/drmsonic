<!DOCTYPE html>
<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}

		<br>

		<div style="width: 60%; overflow:hidden; display: flex; margin-left: 20px;">
			<div class="input-group mb-3">
				<span class="input-group-text">Input Bandwidth</span>
				<input disabled style='width: 100px; background-color: #fff;' class="form control" id="totalBwInText" type="text"/>
			</div>
			<div class="input-group mb-3">
				<span class="input-group-text">Output Bandwidth</span>
				<input disabled style='width: 100px; background-color: #fff;' class="form control" id="totalBwOutText" type="text"/>
			</div>
			<div class="input-group mb-3">
				<span class="input-group-text">CPU Load</span>
				<input disabled style='width: 100px; background-color: #fff;' class="form control" id="cpuLoadText" type="text"/>
			</div>
			<div class="input-group mb-3">
				<span class="input-group-text">Memory Usage</span>
				<input disabled style='width: 100px; background-color: #fff;' class="form control" id="memoryText" type="text"/>
			</div>
		</div>

		<br>

		<table id="clientsTable" border="1" style="clear:both;" class="table table-dark">
			<THEAD>
			<TR>
				<TH>Stream</TH>
				<TH>Provider</TH>
				<TH>Type</TH>
				<TH>User</TH>
				<TH>Client IP</TH>
				<TH>User Agent</TH>
				<TH>Uptime</TH>
				<TH>Errors</TH>
				<TH>Bandwidth (Kb/s)</TH>
			</TR>
			</THEAD>
			<TBODY>
			</TBODY>
		</table>

		<script type="text/javascript">

			document.getElementById('monitoringbutton').style.backgroundColor = 'darkblue';

			var table = $('#clientsTable').DataTable( {
							"dom": "<i><'row' <'col-sm'f>>rt",
							"paging": false,
							"responsive": true
						});

			updateMonitoring(table);
			intervalId=setInterval("updateMonitoring(table);",1000);
		</script>
	</body>
</html>
