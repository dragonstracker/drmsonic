<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}
		<div class="providergrid">
			{{range $p := .Providers}}
			<div class="providertile">
				<p title="{{$p.Name}}">{{$p.Name}}</p>
				<a href="status/{{$p.Id}}"><img src="{{$p.Id}}.png" onerror="if (!this.src.endsWith('static/default_logo.png')) this.src = 'static/default_logo.png';" alt="{{$p.Name}}"></a>
			</div>
			{{end}}
		</div>
		<script type="text/javascript">
			document.getElementById('providersbutton').style.backgroundColor = 'darkblue';
		</script>
	</body>
</html>
