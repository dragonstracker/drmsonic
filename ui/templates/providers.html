<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}
		{{range $p := .Providers}}
		<div class="img-with-text">
			<p>{{$p.Name}}</p>
			<a href="status/{{$p.Id}}"><img src="{{$p.Id}}.png" onerror="if (!this.src.endsWith('static/default_logo.png')) this.src = 'static/default_logo.png';" style="width:100px;"></a>
		</div>
		{{end}}
		<script type="text/javascript">
			document.getElementById('providersbutton').style.backgroundColor = 'darkblue';
		</script>
	</body>
</html>
