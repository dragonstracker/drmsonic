<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}
		<div id="hiddendiv" hidden style="width: 100%; overflow:hidden; margin-top: -200px;">
			<div style="float: left; margin-left: 20px;">
				<form id="addRecForm">
					<div style='width: 350px;' class="input-group mb-3">
						<div  style="display: flex;">
							<div class="input-group-prepend">
								<input style='width: 135px;' type="submit" class="btn btn-outline-primary btn-sm" id="addRec" value="ADD RECORDING" />
							</div>
							{{ if .Providers }}
							<select style='text-align:center; vertical-align:middle; font-weight: bold; width: 150px' id="providerSelection" >
							{{range $n, $g := .Providers}}
								<option value="{{$g.Id}}">{{$g.Name}}</option>
							{{end}}
							</select>
							<select style='text-align:center; vertical-align:middle; font-weight: bold; width: 200px;' id="addRecChan" >
							</select>
							{{ end }}
						</div>
						<div class="container mt-2">
							<br>
							<div>
								<a>Start</a>
								<div  style="display: flex;">
									<input id="recStartDate" class="form-control" type="date" />
									<input id="recStartTime" class="form-control" type="time" />
								</div>
								<br>
								<a>End</a>
								<div style="display: flex;">
									<input id="recEndDate" class="form-control" type="date" />
									<input id="recEndTime" class="form-control" type="time" />
								</div>
							</div>
						</div>
					</div>

				</form>
				<br>
				<div id="recActionStatus"></div>
				<br>
				<div style="display: flex;">
					<form id="recDeleteForm" ><input type="submit" class="btn btn-primary btn-sm" value="DELETE SELECTION" id="recdelete"/></form>
					&nbsp;
					<form id="recStopForm" ><input type="submit" class="btn btn-primary btn-sm" value="STOP SELECTION" id="recstop"/></form>
				</div>
			</div>
		</div>

		<table style="clear:both;" id="recsTable" class="table table-dark">
			<thead>
				<TR>
					<TH></TH>
					<TH>Provider</TH>
					<TH>Channel</TH>
					<TH>Status</TH>
					<TH>Start time</TH>
					<TH>End time</TH>
				</TR>
			</thead>
			<tbody>
				{{range $n, $r := .Recordings}}
				<TR>
					<TD>
						<input class="form-check-input" type="checkbox" id="recchecked{{$n}}" />
					</TD>
					<TD>
						<a id="recprovidername{{$n}}" >{{$r.ProviderName}}</a>
					</TD>
					<TD>
						<a id="recstreamname{{$n}}" >{{$r.StreamName}}</a>
						<input type="hidden" id="recid{{$n}}" value="{{$r.Id}}">
						<input type="hidden" id="recstreamid{{$n}}" value="{{$r.StreamId}}">
					</TD>
					<TD>
						<a id="recstatus{{$n}}">{{$r.Status}}</a>
					</TD>
					<TD>
						<a id="recstart{{$n}}"></a>
					</TD>
					<TD>
						<a id="recend{{$n}}"></>
					</TD>
				</TR>
				{{ end }}

			</tbody>
		</table>

		<script type="text/javascript">
			document.getElementById('recbutton').style.backgroundColor = 'darkblue';

			var hls;
			initPlayer();

			var intervalId = null;
			var PChangeCounter = new Object();
			var GlobalChangeCounter = -2;

			var date = new Date();
			var currentDate = date.toISOString().slice(0,10)
			var mins = date.getMinutes();
			if (mins <= 9) {
				mins = '0' + mins
			}
			var currentTime = date.getHours() + ':' + mins;

			document.getElementById('recStartDate').value = currentDate;
			document.getElementById('recEndDate').value = currentDate;
			document.getElementById('recStartTime').value = currentTime;
			document.getElementById('recEndTime').value = currentTime;

			{{range $n, $r := .Recordings}}

				document.getElementById('recstreamname{{$n}}').href = '{{$r.StreamingUrl}}';
				recstreamname{{$n}}.onclick = setPlayer;

				localStart = new Date('{{$r.Start}}');
				localEnd = new Date('{{$r.End}}');

				document.getElementById('recstart{{$n}}').innerText = localStart.toLocaleString('fr-FR')
				document.getElementById('recend{{$n}}').innerText = localEnd.toLocaleString('fr-FR')
			{{ end }}

			var table = $('#recsTable').DataTable( {"dom": "<i><'row' <'col-sm'l><'col-sm'p><'col-sm'f>>rt"});

			addRecForm.onsubmit = addRecFormSubmit;
			recDeleteForm.onsubmit = recDeleteSubmit;
			recStopForm.onsubmit = recStopSubmit;
			playerAudioSelect.onchange = playerAudioSelectOnchange;
			playerSubtitlesSelect.onchange = playerSubtitlesSelectOnchange;
			providerSelection.onchange = updateRecordingChannels

			document.getElementById("hiddendiv").removeAttribute("hidden");

			updateRecordings();
			updateRecordingChannels();
			setInterval("updateRecordings();",1000);

		</script>

	</body>

</html>
