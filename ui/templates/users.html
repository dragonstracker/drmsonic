<html>
	{{template "headers.html" .}}
	<body>
		{{template "menu.html" .}}
		<div style="width: 100%; overflow:hidden;">
			<div style="float: left; margin-left: 20px;">
				<form id="addUserForm">
					<div style='width: 350px;' class="input-group mb-3">
						<div class="input-group-prepend">
							<input style='width: 135px;' type="submit" class="btn btn-outline-primary btn-sm" id="add" value="ADD USER" />
						</div>
						<input class="form control" placeholder="user name" aria-label="user name"  id="addUserText" type="text" value="" />
					</div>
				</form>
				<div class="form-check" style="margin-bottom: 12px;">
					<input class="form-check-input" type="checkbox" id="noauth" {{ if .NoAuth }} checked {{ end }}/>
					<label class="form-check-label" for="noauth">Open panel without login</label>
				</div>
				<input type="button" style="width:150px" class="btn btn-primary btn-sm" value="SAVE USERS" id="saveusers"/>
				<br>
			</div>
		</div>
		<br>
		<table style="clear:both;" id="usersTable" class="table table-dark table-bordered" border="1" >
			<thead>
				<TR style='text-align:center; vertical-align:middle;'>
					<TH>User</TH>
					<TH>Password</TH>
					<TH>Providers</TH>
					<TH>Networks</TH>
					<TH>Parameters</TH>
					<TH></TH>
				</TR>
			</thead>
			<tbody>
				{{range $n, $s := .Users}}
				<TR>
					<TD style='text-align:center; vertical-align:middle; width:250px'>
						<a style="width:250px;text-align:center; vertical-align:middle" id="username{{$n}}" >{{$s.Username}}</a>
					</TD>
					<TD style='text-align:center; vertical-align:middle; width:250px'>
						<div id="passwordDiv{{$n}}">
							<input class="form-control" placeholder="{{ if $s.Password }}leave blank to keep{{ else }}set password{{ end }}" aria-label="password" id="password{{$n}}" type="password" value=""/>
						</div>
					</TD>
					<TD style='text-align:center; vertical-align:middle; width:250px'>
						<select class="selectpicker" multiple data-width="100%" id="userProviders{{$n}}">
							{{range $m, $p := $.Providers}}
							<option value="{{$p.Id}}" {{range $x, $pid := $s.ProviderIds}}{{ if eq $pid $p.Id }} selected {{ end }}{{end}}>{{$p.Name}}</option>
							{{end}}
						</select>
					</TD>
					<TD style='text-align:center; vertical-align:middle; width:250px'>
						<div id="networkDiv{{$n}}">
							<input class="form-control" placeholder="networks or ips" aria-label="networks or ips" id="network{{$n}}" type="text" value="{{$s.Network}}"/>
						</div>
					</TD>
					<TD style='text-align:center; vertical-align:middle; width:250px'>
						<div class="form-check" id="isadminDiv{{$n}}">
							<input class="form-check-input" type="checkbox" id="isadmin{{$n}}" {{ if $s.IsAdmin }} checked {{ end }}/>
							<label class="form-check-label" for="isadmin{{$n}}">Admin</label>
						</div>
						<div class="form-check" id="haswebaccessDiv{{$n}}">
							<input class="form-check-input" type="checkbox" id="haswebaccess{{$n}}" {{ if $s.HasWebAccess }} checked {{ end }}/>
							<label class="form-check-label" for="haswebaccess{{$n}}">Web Access</label>
						</div>
					</TD>
					<TD style='text-align:center; vertical-align:middle; width:100px'>
						<div style="display: flex;">
							<div class="dropdown">
								<button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
									PLAYLIST
								</button>
								<ul class="dropdown-menu">
									{{ if $s.Password }}
									<li><a class="dropdown-item" href="{{pathEscape $s.Username}}/{{pathEscape $s.Password}}/playlist.m3u">Full</a></li>
									<li><a class="dropdown-item" href="{{pathEscape $s.Username}}/{{pathEscape $s.Password}}/live.m3u">Live</a></li>
									<li><a class="dropdown-item" href="{{pathEscape $s.Username}}/{{pathEscape $s.Password}}/event.m3u">Events</a></li>
									<li><a class="dropdown-item" href="{{pathEscape $s.Username}}/{{pathEscape $s.Password}}/replay.m3u">Replays</a></li>
									<li><a class="dropdown-item" href="{{pathEscape $s.Username}}/{{pathEscape $s.Password}}/app1.conf">App1</a></li>
									{{ else }}
									<li><span class="dropdown-item disabled">Set a password to unlock links</span></li>
									{{ end }}
								</ul>
							</div>
							&nbsp;&nbsp;
							<input type="button" class="btn btn-primary" id="renameuser{{$n}}" value="RENAME" />
							&nbsp;&nbsp;
							<input type="button" class="btn btn-primary" id="deleteuser{{$n}}" value="DELETE" />
						</div>
					</TD>
				</TR>
				{{ end }}
			</tbody>
		</table>

		<script type="text/javascript">
			document.getElementById('usersbutton').style.backgroundColor = 'darkblue';

			addUserForm.onsubmit = addUserFormSubmit;
			saveusers.onclick = saveClick;

			var intervalId = null;
			var PChangeCounter = new Object();
			var GlobalChangeCounter = -2;

			{{range $n, $c := .Users}}
				passwordDiv{{$n}}.onchange = updateUser;
				networkDiv{{$n}}.onchange = updateUser;
				userProviders{{$n}}.onchange = updateUser;
				isadminDiv{{$n}}.onchange = updateUser;
				haswebaccessDiv{{$n}}.onchange = updateUser;
				deleteuser{{$n}}.onclick = deleteUserClick;
				renameuser{{$n}}.onclick = renameUserClick;
			{{end}}

			$('.selectpicker').selectpicker();
			var usersTable = $('#usersTable').removeAttr('width').DataTable({
				"dom": "<i><'row' <'col-sm'l><'col-sm'p><'col-sm'f>>rt",
				"autoWidth": false
			});
		</script>
	</body>
</html>
